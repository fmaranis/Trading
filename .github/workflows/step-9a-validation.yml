name: Step 9A Multi-Asset Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        id: typescript
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee tsc.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish TypeScript diagnostics
        if: steps.typescript.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### TypeScript diagnostics'
            echo '```text'
            tail -n 120 tsc.log
            echo '```'
          } > tsc-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file tsc-comment.md
      - name: Fail on TypeScript errors
        if: steps.typescript.outputs.exit_code != '0'
        run: exit 1
      - name: Multi-asset tests 119-135
        run: npm run test:multi-asset
      - name: Production build
        run: npm run build
