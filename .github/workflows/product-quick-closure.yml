# Fast, deterministic closure only. Never run historical replays, market
# downloads, research sweeps or GitHub-hosted long calculations in this workflow.
name: Producto - cierre rápido (código)
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "server.ts"
      - "index.html"
      - "portfolio.html"
      - "legacy.html"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.*"
      - ".github/workflows/product-quick-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-quick-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-quick-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Production bundle (web and server)
        run: npm run build
      - name: Production HTTP smoke (local only, no market requests)
        run: |
          PORT=3109 NODE_ENV=production ALERT_AUTOMATION_ENABLED=false node dist/server.cjs > /tmp/trading-http-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          healthy=0
          for attempt in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:3109/api/health -o /tmp/trading-health.json; then
              healthy=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/trading-http-smoke.log
              exit 1
            fi
            sleep 1
          done
          if [ "$healthy" != 1 ]; then
            cat /tmp/trading-http-smoke.log
            exit 1
          fi
          node -e 'const fs=require("node:fs"); const h=JSON.parse(fs.readFileSync("/tmp/trading-health.json","utf8")); if(h.status!=="ok"||h.buildCommitSha!==process.env.GITHUB_SHA||h.buildProvenance!=="GITHUB_CI_SHA") { console.error("BUILD_IDENTITY_MISMATCH",h); process.exit(1); }'
          curl --fail --silent --show-error -D /tmp/trading-home-headers.txt http://127.0.0.1:3109/ -o /tmp/trading-home.html
          grep -q 'assets/index-' /tmp/trading-home.html
          grep -Eiq '^cache-control:.*no-store' /tmp/trading-home-headers.txt
          curl --fail --silent --show-error -D /tmp/trading-portfolio-headers.txt http://127.0.0.1:3109/portfolio.html -o /tmp/trading-portfolio.html
          grep -q 'assets/' /tmp/trading-portfolio.html
          grep -Eiq '^cache-control:.*no-store' /tmp/trading-portfolio-headers.txt
          curl --fail --silent --show-error -D /tmp/trading-health-headers.txt http://127.0.0.1:3109/api/health -o /dev/null
          grep -Eiq '^cache-control:.*no-store' /tmp/trading-health-headers.txt
          # Inspect compiled assets, not just source, for the reconciled portfolio UI.
          grep -rlF --include='*.js' 'sin crear aportaciones ni intereses bancarios supuestos' dist/assets > /tmp/trading-reconciled-bundles.txt
          grep -rlF --include='*.js' 'rentabilidad N/D' dist/assets > /tmp/trading-reconciled-labels.txt
          if grep -rFl --include='*.js' 'Interés abonado' dist/assets; then
            echo 'STALE_PORTFOLIO_INTEREST_LABEL_IN_BUNDLE'
            exit 1
          fi
          grep -rlF --include='*.js' 'Candidatos realmente evaluados por los filtros de entrada' dist/assets > /tmp/trading-gate-explanation.txt
      - name: Product surface contracts
        run: npx --no-install tsx tests/productSurfaceClosureV1.unit.ts
      - name: Production decision architecture
        run: npx --no-install tsx tests/coreArchitectureV1.unit.ts
      - name: Historical replay export invariants (fixture-only; no replay)
        run: node tests/historicalReplayEvidenceAudit.unit.mjs
      - name: Candidate selection and causal price-volume guards
        run: npx --no-install tsx tests/portfolioCandidateGate.unit.ts
      - name: Single decision and executable plan guards
        run: |
          npx --no-install tsx tests/productDecisionSurface.unit.ts
          npx --no-install tsx tests/portfolioExecutionPlan.unit.ts
      - name: Portfolio and tax safety
        run: |
          npx --no-install tsx tests/userPortfolio.unit.ts
          npx --no-install tsx tests/taxAwareExecutionOverlay.unit.ts
      - name: Broker registration, private account and position-health guards
        run: |
          npx --no-install tsx tests/executedPurchaseRegistration.unit.ts
          npx --no-install tsx tests/brokerAvailability.unit.ts
          npx --no-install tsx tests/portfolioPositionHealth.unit.ts
          npx --no-install tsx tests/privateUserSecurity.unit.ts
          npx --no-install tsx tests/decisionArchitectureParity.unit.ts
